name: Build AutoDJ binaries

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: AutoDJ-windows
            binary_path: backend/dist/AutoDJ.exe
          - os: macos-latest
            artifact_name: AutoDJ-macos
            binary_path: backend/dist/AutoDJ.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Run backend tests
        working-directory: backend
        run: pytest tests/ -v

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build binary with PyInstaller
        working-directory: backend
        run: pyinstaller AutoDJ.spec --clean --noconfirm

      - name: Package macOS .app into a zip
        if: runner.os == 'macOS'
        working-directory: backend/dist
        run: zip -r AutoDJ-macos.zip AutoDJ.app

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: backend/dist/AutoDJ.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: backend/dist/AutoDJ-macos.zip

  release:
    name: Attach binaries to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AutoDJ-windows/AutoDJ.exe
            artifacts/AutoDJ-macos/AutoDJ-macos.zip
          generate_release_notes: true
